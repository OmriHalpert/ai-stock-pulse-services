name: Build and Push Containers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 661985535801.dkr.ecr.eu-west-1.amazonaws.com

jobs:
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Source SAST + secrets
      - name: Run Semgrep SAST Scan
        run: >
          semgrep scan --error
          --config p/security-audit
          --config p/secrets

  build-and-push:
    needs: sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            ecr_repository: ai-stock-pulse/backend
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            ecr_repository: ai-stock-pulse/frontend
          - name: agent
            context: ./agent
            dockerfile: ./agent/Dockerfile
            ecr_repository: ai-stock-pulse/agent

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE=${{ env.ECR_REGISTRY }}/${{ matrix.service.ecr_repository }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata & Generate Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::661985535801:role/ai-stock-pulse-gha-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"

  update-manifests:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ai-stock-pulse-manifests
          token: ${{ secrets.GITOPS_PAT }}
          path: manifests

      - name: Update Image Tags in values-dev.yaml
        working-directory: manifests
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          export SHORT_SHA="${SHORT_SHA:0:7}"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("charts/ai-stock-pulse/values-dev.yaml")
          text = path.read_text()
          sha = os.environ["SHORT_SHA"]
          updated, count = re.subn(
              r'^(\s+tag:\s*)".*"\s*$',
              rf'\1"{sha}"',
              text,
              flags=re.M,
          )
          if count != 3:
              raise SystemExit(
                  f"expected to update 3 image tags in {path}, updated {count}"
              )
          path.write_text(updated)
          print(f"set backend/frontend/agent tags to {sha}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/ai-stock-pulse/values-dev.yaml
          if git diff --staged --quiet; then
            echo "tags already ${SHORT_SHA}; nothing to commit"
          else
            git commit -m "ci: bump image tag to ${SHORT_SHA} [skip ci]"
            git push origin main
          fi
