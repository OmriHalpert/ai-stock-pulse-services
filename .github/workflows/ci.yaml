name: Build and Push Containers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: ai-stock-backend
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: ai-stock-frontend
          - name: agent
            context: ./agent
            dockerfile: ./agent/Dockerfile
            image: ai-stock-agent

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.service.image }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Generate Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ai-stock-pulse-manifests
          token: ${{ secrets.GITOPS_PAT }}
          path: manifests

      - name: Update Image Tags in values-dev.yaml
        run: |
          cd manifests
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # Update backend, frontend, and agent tags to the new short SHA
          sed -i "s/tag: .*/tag: \"${SHORT_SHA}\"/g" charts/ai-stock-pulse/values-dev.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/ai-stock-pulse/values-dev.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci: bump image tag to ${SHORT_SHA} [skip ci]" && git push origin main)